<style>
/* Düzen: solda tam boy 3B sahne, sağda atölye kontrol paneli; telefonda alt alta. Pirinç insert rengi vurgu. */
:root {
  --bg: #eceef1; --panel: #f8f9fa; --fg: #1a1e23; --muted: #5b6470; --line: #d3d8de;
  --accent: #b27a12; --accent-ink: #ffffff; --viewer: #e1e4e8; --grid1: #b9c0c8; --grid2: #cfd4da;
  --edge: #0d0f12; --chip: #e6e9ed;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --panel: #181b20; --fg: #e5e8eb; --muted: #97a0aa; --line: #2a2f37;
  --accent: #e0a535; --accent-ink: #1a1306; --viewer: #0d0f12; --grid1: #2c323a; --grid2: #1d2127;
  --edge: #050607; --chip: #22262c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --panel: #181b20; --fg: #e5e8eb; --muted: #97a0aa; --line: #2a2f37;
  --accent: #e0a535; --accent-ink: #1a1306; --viewer: #0d0f12; --grid1: #2c323a; --grid2: #1d2127;
  --edge: #050607; --chip: #22262c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-display); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
.viewer { position: relative; background: var(--viewer); min-width: 0; overflow: hidden; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.hud { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.hud h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.hud p { margin: 2px 0 0; font: 500 .75rem/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.views { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 10px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); max-width: calc(100% - 32px); }
.views button, .seg button, .btn { font: 600 .78rem var(--f-display); color: var(--fg); background: transparent; border: 0;
  padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.views button:hover, .seg button:hover, .btn:hover { background: var(--chip); }
.views button.on, .seg button.on { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { position: absolute; top: 64px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; }
.card .k { font: 500 .68rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.card h2 { margin: 2px 0 6px; font-size: 1rem; }
.card p { margin: 0; font-size: .82rem; line-height: 1.45; color: var(--muted); }
.card .x { position: absolute; top: 6px; right: 6px; padding: 4px 8px; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 16px 24px;
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
section h3 { margin: 0 0 8px; font: 600 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.row output { font: 500 .78rem var(--f-mono); min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--chip); border-radius: 9px; flex-wrap: wrap; }
.seg button { flex: 1; }
.btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); }
.chk { display: flex; align-items: center; gap: 8px; font-size: .84rem; margin-top: 8px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.parts { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.parts li { display: grid; grid-template-columns: 18px 12px minmax(0, 1fr); align-items: center; gap: 8px;
  padding: 5px 6px; border-radius: 6px; font-size: .84rem; }
.parts li.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.parts li input { accent-color: var(--accent); margin: 0; }
.parts .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
.parts .nm { background: none; border: 0; color: var(--fg); font: inherit; text-align: left; padding: 0; cursor: pointer; }
.grp { font: 600 .7rem var(--f-mono); color: var(--muted); margin: 6px 0 4px; letter-spacing: .04em; }
.hint { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 0; }
.load { position: absolute; inset: 0; display: grid; place-items: center; font: 500 .85rem var(--f-mono); color: var(--muted); }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .viewer { height: 64svh; min-height: 340px; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card { top: auto; bottom: 70px; }
}
</style>

  <div class="viewer" id="viewer">

    <section>

    <section>

      <div class="btns">
        <button class="btn" id="showAll">Hepsi</button>

        <button class="btn" id="onlyElec">İç düzen</button>

  </aside>
</div>

<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PRINTED = new Set(['govde', 'panel', 'yazi', 'tutucu']);
  const COLOR_OVERRIDE = { govde: '#363a41', panel: '#4a4f57' };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ---- sahne ----
  const canvas = $('c'), viewer = $('viewer');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.09;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444a55, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(250, 400, 300); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-300, 150, -200); scene.add(fill);

  const root = new THREE.Group(); scene.add(root);
  root.position.set(-D.center[0], -D.center[1], -D.center[2]);

  const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e5);
  let clipOn = false;
  const planes = () => clipOn ? [clipPlane] : [];

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const groups = {};      // key -> {group, meshes:[], caps:[], edges:[], explode}
  const mats = [];

  for (const it of D.items) {
    const pos = new Int16Array(b64(it.p));
    const f = new Float32Array(pos.length); for (let i = 0; i < pos.length; i++) f[i] = pos[i] / 100;
    const idx = it.i32 ? new Uint32Array(b64(it.i)) : new Uint16Array(b64(it.i));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(f, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    const col = new THREE.Color(COLOR_OVERRIDE[it.key] || it.color);
    const metal = col.r > 0.55 && Math.abs(col.r - col.b) < 0.25 || it.key === 'insert';
    const m = new THREE.MeshStandardMaterial({ color: col, roughness: metal ? 0.35 : 0.62, metalness: metal ? 0.55 : 0.05,
      side: THREE.FrontSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const mesh = new THREE.Mesh(g, m); mesh.userData.key = it.key;
    const capCol = col.clone().lerp(new THREE.Color(css('--accent') || '#c98a1b'), 0.45);
    const cm = new THREE.MeshBasicMaterial({ color: capCol, side: THREE.BackSide });
    const cap = new THREE.Mesh(g, cm); cap.visible = false;
    const em = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55 });
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), em);
    if (!groups[it.key]) {
      const grp = new THREE.Group(); root.add(grp);
      groups[it.key] = { group: grp, meshes: [], caps: [], edges: [], explode: new THREE.Vector3(...it.explode) };
    }
    const G = groups[it.key];
    G.group.add(mesh, cap, edges); G.meshes.push(mesh); G.caps.push(cap); G.edges.push(edges);
    mats.push(m, cm, em);
  }

  // sınırlar (toplu hâl)
  const bbox = new THREE.Box3().setFromObject(root);
  const grid = new THREE.GridHelper(400, 40);
  grid.position.y = bbox.min.y - 0.3; scene.add(grid);

  function applyTheme() {
    scene.background = new THREE.Color(css('--viewer'));
    const e = new THREE.Color(css('--edge'));
    for (const k in groups) for (const l of groups[k].edges) l.material.color.copy(e);
    const g1 = new THREE.Color(css('--grid1'));
    const colors = grid.geometry.attributes.color;
    for (let i = 0; i < colors.count; i++) colors.setXYZ(i, g1.r, g1.g, g1.b);
    colors.needsUpdate = true;
  }
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---- kamera ----
  const DIST = 380;
  const VIEWS = { iso: [0.85, 0.62, 1], front: [0, 0.18, 1], back: [0, 0.25, -1], left: [-1, 0.18, 0], right: [1, 0.18, 0],
                  top: [0, 1, 0.0001], bottom: [0, -1, 0.0001] };
  let camTween = null;
  function setView(v, instant) {
    const tg = new THREE.Vector3(0, 38 * ex, 0);
    const d = new THREE.Vector3(...VIEWS[v]).normalize().multiplyScalar(DIST * (1 + 0.45 * ex)).add(tg);
    if (instant || reduce) { camera.position.copy(d); controls.target.copy(tg); controls.update(); return; }
    camTween = { from: camera.position.clone(), to: d, t0: performance.now(), tFrom: controls.target.clone(), tTo: tg };
  }
  $('views').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('views').children].forEach(x => x.classList.toggle('on', x === b));
    setView(b.dataset.v);
  });

  // ---- patlatma ----
  let ex = 0, exTween = null;
  function setExplode(t) {
    // kamera patlamayla birlikte yukarı kayar ve uzaklaşır, parçalar kadrajda kalsın
    const k = (1 + 0.45 * t) / (1 + 0.45 * ex), dy = 38 * (t - ex);
    if (!camTween) {
      const off = camera.position.clone().sub(controls.target).multiplyScalar(k);
      controls.target.y += dy; camera.position.copy(controls.target).add(off);
    }
    ex = t;
    for (const k in groups) groups[k].group.position.copy(groups[k].explode).multiplyScalar(t);
    $('explode').value = Math.round(t * 100); $('explodeo').textContent = Math.round(t * 100) + '%';
  }
  $('explode').addEventListener('input', e => { exTween = null; setExplode(e.target.value / 100); });
  const animEx = to => { if (reduce) return setExplode(to); exTween = { from: ex, to, t0: performance.now() }; };
  $('exOpen').onclick = () => animEx(1);
  $('exClose').onclick = () => animEx(0);

  // ---- görünüm modu ----
  let mode = 'solid';
  function applyMode() {
    for (const k in groups) {
      const G = groups[k], xr = mode === 'xray' && PRINTED.has(k);
      for (const m of G.meshes) {
        m.material.wireframe = mode === 'wire';
        m.material.transparent = xr; m.material.opacity = xr ? 0.16 : 1; m.material.depthWrite = !xr;
        m.material.needsUpdate = true;
      }
      for (const c of G.caps) c.visible = clipOn && $('cap').checked && mode !== 'wire' && !xr;
      for (const l of G.edges) { l.visible = $('edges').checked && mode !== 'wire'; l.material.opacity = xr ? 0.35 : 0.55; }
    }
  }
  $('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m; [...$('mode').children].forEach(x => x.classList.toggle('on', x === b)); applyMode();
  });
  $('edges').onchange = applyMode;
  $('grid').onchange = e => grid.visible = e.target.checked;

  // ---- kesit ----
  let axis = 'off', flip = false;
  const AX = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  function clipRange() {
    const lo = bbox.min.clone().add(root.position), hi = bbox.max.clone().add(root.position);
    return [lo[axis] - 1, hi[axis] + 1];
  }
  function applyClip() {
    clipOn = axis !== 'off';
    $('clipv').disabled = !clipOn; $('clipflip').disabled = !clipOn;
    if (clipOn) {
      const [lo, hi] = clipRange(); const s = lo + (hi - lo) * $('clipv').value / 1000;
      const n = new THREE.Vector3(...AX[axis]).multiplyScalar(flip ? 1 : -1);
      clipPlane.normal.copy(n); clipPlane.constant = flip ? -s : s;
      const mm = { x: s + D.W / 2, y: s + D.center[1], z: -D.center[2] - s }[axis];
      $('clipo').textContent = mm.toFixed(0) + ' mm';
    } else $('clipo').textContent = '–';
    for (const m of mats) { m.clippingPlanes = planes(); m.clipShadows = true; m.needsUpdate = true; }
    applyMode();
  }
  $('clip').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    axis = b.dataset.a; [...$('clip').children].forEach(x => x.classList.toggle('on', x === b));
    if (axis !== 'off') { $('clipv').value = 500; if (mode === 'xray') { mode = 'solid'; [...$('mode').children].forEach(x => x.classList.toggle('on', x.dataset.m === 'solid')); } }
    applyClip();
  });
  $('clipv').addEventListener('input', applyClip);
  $('clipflip').onclick = () => { flip = !flip; applyClip(); };
  $('cap').onchange = applyMode;

  // ---- parça listesi ----
  const list = $('partlist');
  for (const [title, keys] of D.groups) {
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = title; list.appendChild(h);
    const ul = document.createElement('ul'); ul.className = 'parts';
    for (const k of keys) {
      if (!groups[k]) continue;
      const li = document.createElement('li'); li.dataset.k = k;
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.id = 'p_' + k;
      cb.setAttribute('aria-label', D.info[k][0] + ' görünür');
      cb.onchange = () => { groups[k].group.visible = cb.checked; };
      const sw = document.createElement('span'); sw.className = 'sw';
      sw.style.background = '#' + groups[k].meshes[0].material.color.getHexString();
      const nm = document.createElement('button'); nm.className = 'nm'; nm.textContent = D.info[k][0];
      nm.onclick = () => select(k);
      li.append(cb, sw, nm); ul.appendChild(li);
    }
    list.appendChild(ul);
  }
  function showOnly(fn) {
    for (const k in groups) { const v = fn(k); groups[k].group.visible = v; const cb = $('p_' + k); if (cb) cb.checked = v; }
  }
  $('showAll').onclick = () => showOnly(() => true);
  $('onlyPrint').onclick = () => showOnly(k => PRINTED.has(k));
  $('onlyElec').onclick = () => showOnly(k => k !== 'panel' && k !== 'yazi');

  // ---- seçim ----
  let selected = null;
  const accentCol = () => new THREE.Color(css('--accent') || '#c98a1b');
  function select(k) {
    if (selected) for (const m of groups[selected].meshes) m.material.emissive.setHex(0x000000);
    selected = k;
    document.querySelectorAll('.parts li').forEach(li => li.classList.toggle('sel', li.dataset.k === k));
    if (!k) { $('card').hidden = true; return; }
    const a = accentCol().multiplyScalar(0.45);
    for (const m of groups[k].meshes) m.material.emissive.copy(a);
    const [name, kind, text] = D.info[k];
    $('cardk').textContent = kind; $('cardh').textContent = name; $('cardp').textContent = text; $('card').hidden = false;
  }
  $('cardx').onclick = () => select(null);
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
  canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = canvas.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const vis = []; for (const k in groups) if (groups[k].group.visible) vis.push(...groups[k].meshes);
    let hits = ray.intersectObjects(vis, false);
    if (clipOn) hits = hits.filter(h => clipPlane.distanceToPoint(h.point) >= 0);
    if (mode === 'xray') { const inner = hits.find(h => !PRINTED.has(h.object.userData.key)); if (inner) hits = [inner]; }
    select(hits.length ? hits[0].object.userData.key : null);
  });

  // ---- döngü ----
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function resize() {
    const w = viewer.clientWidth, h = viewer.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 560 ? 48 : 35; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(viewer); resize();
  setView('iso', true); setExplode(0); applyClip();
  $('load').hidden = true;
  function frame(now) {
    if (camTween) {
      const t = Math.min(1, (now - camTween.t0) / 550), k = ease(t);
      camera.position.lerpVectors(camTween.from, camTween.to, k);
      controls.target.lerpVectors(camTween.tFrom, camTween.tTo, k);
      if (t >= 1) camTween = null;
    }
    if (exTween) {
      const t = Math.min(1, (now - exTween.t0) / 800);
      setExplode(exTween.from + (exTween.to - exTween.from) * ease(t));
      if (t >= 1) exTween = null;
    }
    controls.autoRotate = $('spin').checked && !reduce; controls.autoRotateSpeed = 1.2;
    controls.update(); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
